[package]
name = "floatspace"
version = "0.1.0"
description = "A calm thinking space beside macOS"
authors = ["Floatspace"]
edition = "2021"

[lib]
name = "floatspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
    objc2 = "0.6.3"
    objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSColor", "NSWindow", "NSView", "NSVisualEffectView"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindowLevel"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
